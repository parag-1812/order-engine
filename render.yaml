# Render Blueprint for the Crave cloud-kitchen backend (3 Spring Boot services).
# In Render: New > Blueprint > pick this repo. Values marked `sync: false`
# are secrets: Render asks you to type them in; they are never stored here.
#
# After the Blueprint is created, add ONE secret file to `crave-auth`:
#   Environment > Secret Files > filename `jwt-private.pem`, contents of
#   multi-role-auth-service/src/main/resources/keys/jwt-private.pem (local only).

services:
  - type: web
    name: crave-auth
    runtime: docker
    plan: free
    repo: https://github.com/parag-1812/multi-role-auth-service
    branch: main
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_NAME
        value: auth_db
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: JWT_PRIVATE_KEY
        value: file:/etc/secrets/jwt-private.pem
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  - type: web
    name: crave-orders
    runtime: docker
    plan: free
    repo: https://github.com/parag-1812/order-engine
    branch: main
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_NAME
        value: order_db
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  - type: web
    name: crave-ai
    runtime: docker
    plan: free
    repo: https://github.com/parag-1812/ai-recipe-service
    branch: main
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

server.port=8080
spring.application.name=order-engine

# ============================================================
# Default (dev) profile: in-memory H2, auto-seeded from data.sql
# so the service boots with zero external dependencies. Use the
# `postgres` profile for a real database (application-postgres.properties).
# ============================================================
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Run data.sql only after Hibernate has created the schema (dev/H2 seed).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================================
# JWT (RS256): order-engine only VERIFIES tokens, so it holds
# the public key alone and cannot mint tokens. Override
# jwt.public-key in production to the shared auth-service key.
# ============================================================
jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}

# ============================================================
# Razorpay (test mode). Keys come from the environment and are
# NEVER committed (the local .razorpay-key file is git-ignored).
# ============================================================
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

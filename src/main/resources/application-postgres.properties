# ============================================================
# PostgreSQL profile for order-engine.
# Activate with: SPRING_PROFILES_ACTIVE=postgres
#            or: --spring.profiles.active=postgres
#
# Database-per-service: this service OWNS `order_db` and no other
# service connects to it.
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}?sslmode=${DB_SSLMODE:require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

# Do not auto-run data.sql against a real database; seed explicitly instead.
spring.sql.init.mode=never
